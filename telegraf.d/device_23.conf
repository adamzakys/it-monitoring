# =====================================================================
# ITNETMON Dynamic Poller Config for Device: Mikrotik Bridge1-LAN Utilitas (ID: 23)
# Auto-generated at: 2026-09-09T02:35:23.903Z
# Interval strategy:
#   - Ping: 1s (fast detection)
#   - Interface traffic: 5s (counters)
#   - Interface inventory: 60s (rarely changes)
#   - CPU: 5s
#   - Storage: 60s
# =====================================================================

# 1. ICMP Ping Poller (1s interval — fast detection)
[[inputs.ping]]
  interval = "1s"
  urls = ["192.168.10.1"]
  count = 1
  ping_interval = 1.0
  # Telegraf inputs.ping typing: Timeout=float seconds, Deadline=int seconds.
  # integer timeout or float deadline makes TOML unmarshal fail on restart.
  timeout = 2.0
  deadline = 2
  binary = "ping"
  [inputs.ping.tags]
    device_id = "23"
    device_name = "Mikrotik_Bridge1-LAN_Utilitas"
    device_ip = "192.168.10.1"

# 2. SNMP Interface Traffic Poller (5s interval — HC counters)
[[inputs.snmp]]
  interval = "5s"
  agents = ["udp://192.168.10.1:161"]
  version = 2
  community = "public"
  timeout = "2s"
  retries = 2

  path = ["/usr/share/snmp/mibs"]

  [inputs.snmp.tags]
    device_id = "23"
    device_name = "Mikrotik_Bridge1-LAN_Utilitas"
    device_ip = "192.168.10.1"

  [[inputs.snmp.table]]
    oid = "IF-MIB::ifXTable"
    name = "net_interface"
    inherit_tags = ["device_id", "device_name", "device_ip"]

    # Tag the interface name so backend queries (traffic history/RX-TX table)
    # can group per interface — previously only ifName FIELD was written.
    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifName"
      name = "interface_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifHCInOctets"
      name = "bytes_in"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifHCOutOctets"
      name = "bytes_out"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifHCInUcastPkts"
      name = "ifHCInUcastPkts"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifHCOutUcastPkts"
      name = "ifHCOutUcastPkts"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifInErrors"
      name = "ifInErrors"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifOutErrors"
      name = "ifOutErrors"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifInDiscards"
      name = "ifInDiscards"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifOutDiscards"
      name = "ifOutDiscards"

# 3. SNMP Interface Inventory Poller (60s — rarely changes)
[[inputs.snmp]]
  interval = "60s"
  agents = ["udp://192.168.10.1:161"]
  version = 2
  community = "public"
  timeout = "2s"
  retries = 2

  path = ["/usr/share/snmp/mibs"]

  [inputs.snmp.tags]
    device_id = "23"
    device_name = "Mikrotik_Bridge1-LAN_Utilitas"
    device_ip = "192.168.10.1"

  [[inputs.snmp.table]]
    oid = "IF-MIB::ifXTable"
    name = "net_interface_inv"
    inherit_tags = ["device_id", "device_name", "device_ip"]

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifName"
      name = "interface_name"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifOperStatus"
      name = "oper_status"

    [[inputs.snmp.table.field]]
      oid = "IF-MIB::ifHighSpeed"
      name = "speed_mbps"

# 4. SNMP System Metrics (60s — uptime, CPU, storage)
[[inputs.snmp]]
  interval = "60s"
  # Write the single uptime field to the "system" measurement (backend reads
  # uptime_ticks from measurement "system", not the default "snmp").
  name_override = "system"
  agents = ["udp://192.168.10.1:161"]
  version = 2
  community = "public"
  timeout = "2s"
  retries = 2

  [inputs.snmp.tags]
    device_id = "23"
    device_name = "Mikrotik_Bridge1-LAN_Utilitas"
    device_ip = "192.168.10.1"

  # System Uptime
  [[inputs.snmp.field]]
    oid = ".1.3.6.1.2.1.1.3.0"
    name = "uptime_ticks"

  # CPU Load (Host Resources MIB)
  [[inputs.snmp.table]]
    oid = ".1.3.6.1.2.1.25.3.3"
    name = "system_cpu"
    inherit_tags = ["device_id", "device_name", "device_ip"]

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.3.3.1.2"
      name = "cpu_load_pct"

  # Storage (Host Resources MIB)
  [[inputs.snmp.table]]
    oid = ".1.3.6.1.2.1.25.2.3"
    name = "system_storage"
    inherit_tags = ["device_id", "device_name", "device_ip"]

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.2.3.1.2"
      name = "storage_type"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.2.3.1.3"
      name = "storage_descr"
      is_tag = true

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.2.3.1.4"
      name = "storage_alloc_units"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.2.3.1.5"
      name = "storage_used"

    [[inputs.snmp.table.field]]
      oid = ".1.3.6.1.2.1.25.2.3.1.6"
      name = "storage_size"
